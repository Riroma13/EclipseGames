# EU VPS reverse proxy. Terminate TLS here and keep SQLite private behind it.
server {
    listen 80;
    server_name eclipse.example.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eclipse.example.eu;

    ssl_certificate /etc/letsencrypt/live/eclipse.example.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eclipse.example.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
